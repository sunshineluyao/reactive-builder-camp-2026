name: Cron100 tests and Remix source

on:
  push:
    paths:
      - '.github/workflows/cron100.yml'
      - 'experiments/cron100/foundry.toml'
      - 'experiments/cron100/src/**'
      - 'experiments/cron100/test/**'
      - 'experiments/cron100/remix/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  REACTIVE_REPOSITORY: https://github.com/Reactive-Network/reactive-lib-omni
  REACTIVE_REVISION: 3ade0dcf1d27e67e5783ef807e73a1b9e0c0cce8

jobs:
  test:
    name: Compile and test Cron100
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: experiments/cron100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.7.1
          cache: false

      - name: Check out the pinned Reactive SDK
        run: |
          git init -q lib/reactive-lib-omni
          git -C lib/reactive-lib-omni fetch --depth=1 "$REACTIVE_REPOSITORY.git" "$REACTIVE_REVISION"
          git -C lib/reactive-lib-omni checkout --detach FETCH_HEAD

      - name: Run Foundry tests
        run: forge test -vv

      - name: Prepare Solidity for Remix
        run: |
          remix_file="$RUNNER_TEMP/BoundedCronRemix.sol"
          {
            printf '// Generated from src/BoundedCron.sol. Deploy with Remix on the designated testnets.\n'
            sed "s|\"@reactive/|\"$REACTIVE_REPOSITORY/blob/$REACTIVE_REVISION/|g" src/BoundedCron.sol
          } > "$remix_file"

          if [[ "$GITHUB_REF_NAME" == main ]]; then
            diff -u remix/BoundedCronRemix.sol "$remix_file"
          fi

          {
            printf '## Remix-ready Solidity\n\n'
            printf 'Source commit %s. Use Solidity 0.8.29, Cancun, and optimizer enabled with 200 runs.\n\n' "$GITHUB_SHA"
            printf '%s\n' '~~~solidity'
            cat "$remix_file"
            printf '%s\n' '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
